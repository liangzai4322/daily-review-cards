<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易监控台</title>
  <style>
    :root{--bg:#0d1117;--surface:#151b23;--surface2:#1b2430;--line:#2d3744;--text:#edf2f7;--muted:#96a3b4;--okx:#4c8dff;--binance:#f0b90b;--green:#34c77b;--red:#f06969;--focus:#84adff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .shell{max-width:1280px;margin:0 auto;padding:24px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:0}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:6px;text-transform:uppercase}.health{display:flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #f0696922}.dot.on{background:var(--green);box-shadow:0 0 0 3px #34c77b22}
    .tabs{display:flex;gap:2px;margin:18px 0;border-bottom:1px solid var(--line)}.tab{padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer}.tab.active{color:var(--text);border-color:var(--okx)}.view[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);margin-bottom:16px}.stat{padding:14px 16px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat-label{color:var(--muted);font-size:12px}.stat-value{margin-top:4px;font-size:19px;font-weight:700}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h2{margin:0;font-size:18px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--text);padding:8px 12px;cursor:pointer}.btn:hover{border-color:#4c5a6d}.btn.primary{background:var(--okx);border-color:var(--okx);color:#fff;font-weight:650}.btn.danger{color:#ffb1b1}.btn.small{padding:5px 9px;font-size:12px}
    .positions{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}.position{border:1px solid var(--line);border-top:3px solid var(--okx);background:var(--surface);padding:14px}.position-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.position-name{color:var(--text);text-decoration:none;font-weight:700}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--muted)}.badge.okx{border-color:#4c8dff66;color:#9fc0ff}.badge.binance{border-color:#f0b90b66;color:#f5cf56}.position-main{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metric{border-left:2px solid var(--line);padding-left:9px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:2px;font-size:16px}.positive{color:var(--green)}.negative{color:var(--red)}.empty{border:1px dashed var(--line);padding:30px;color:var(--muted);text-align:center}
    .table-wrap{overflow-x:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:780px;background:var(--surface)}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:12px;font-weight:600;background:#111821}tr:last-child td{border-bottom:0}.channels{display:flex;flex-wrap:wrap;gap:5px}.channel{padding:2px 7px;background:#ffffff0b;border:1px solid var(--line);border-radius:4px;font-size:11px}.actions{display:flex;gap:6px;justify-content:flex-end}.status-on{color:var(--green)}.status-off{color:var(--muted)}
    dialog{width:min(520px,calc(100vw - 24px));border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 24px 80px #000a}dialog::backdrop{background:#05080dbb}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0;font-size:17px}form{padding:18px}.field{margin-bottom:14px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:5px;background:#0f151d;color:var(--text);padding:9px 10px}.checks{display:flex;gap:18px;padding:8px 0}.check{display:flex;align-items:center;gap:7px;color:var(--text);font-size:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:11px 14px;border:1px solid var(--line);background:#202936;color:var(--text);box-shadow:0 10px 30px #0008;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s ease}.toast.show{opacity:1;transform:translateY(0)}.toast.error{border-color:#f0696988}
    @media(max-width:760px){.shell{padding:16px 12px}header{display:block}.health{margin-top:12px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.toolbar{align-items:flex-start}h1{font-size:23px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">Copy trading operations</div><h1>交易监控台</h1></div><div class="health"><span id="healthDot" class="dot"></span><span id="healthText">正在连接监控服务</span></div></header>
    <nav class="tabs" aria-label="监控台视图"><button class="tab active" data-view="overview">持仓概览</button><button class="tab" data-view="people">名单与通知</button></nav>
    <section id="overview" class="view">
      <div class="stats"><div class="stat"><div class="stat-label">监控账户</div><div class="stat-value" id="accountCount">--</div></div><div class="stat"><div class="stat-label">OKX 当前持仓</div><div class="stat-value" id="positionCount">--</div></div><div class="stat"><div class="stat-label">交易轮询</div><div class="stat-value" id="lastCycle">--</div></div><div class="stat"><div class="stat-label">通知中枢</div><div class="stat-value" id="hubStatus">--</div></div></div>
      <div class="toolbar"><div><h2>OKX 持仓</h2><div class="muted" id="refreshTime">尚未刷新</div></div></div><div id="positions" class="positions"></div><div id="monitorError" class="muted" style="margin-top:12px"></div>
    </section>
    <section id="people" class="view" hidden>
      <div class="toolbar"><div><h2>监控名单</h2><div class="muted">名单保存后立即进入下一轮监控</div></div><button class="btn primary" id="addButton">添加监控人</button></div>
      <div class="table-wrap"><table><thead><tr><th>名称</th><th>平台</th><th>账户标识</th><th>通知方式</th><th>状态</th><th></th></tr></thead><tbody id="traderRows"></tbody></table></div>
    </section>
  </main>
  <dialog id="editor"><div class="dialog-head"><h3 id="editorTitle">添加监控人</h3></div><form id="editorForm"><input type="hidden" id="recordId"><div class="field"><label for="name">显示名称</label><input id="name" type="text" autocomplete="off" required placeholder="例如：交易员 A"></div><div class="field"><label for="platform">平台</label><select id="platform"><option value="okx">OKX</option><option value="binance">Binance</option></select></div><div class="field"><label for="identifier" id="identifierLabel">OKX uniqueName</label><input id="identifier" type="text" autocomplete="off" required placeholder="带单员主页中的账户标识"></div><div class="field"><label>通知方式</label><div class="checks"><label class="check"><input id="notifyWecom" type="checkbox">企微</label><label class="check"><input id="notifyEmail" type="checkbox">邮箱</label><label class="check"><input id="enabled" type="checkbox" checked>启用监控</label></div></div><div class="dialog-actions"><button type="button" class="btn" id="cancelButton">取消</button><button type="submit" class="btn primary">保存</button></div></form></dialog>
  <dialog id="login"><div class="dialog-head"><h3>登录交易监控台</h3></div><form id="loginForm"><div class="field"><label for="loginPassword">管理密码</label><input id="loginPassword" type="password" inputmode="numeric" autocomplete="current-password" required></div><div class="dialog-actions"><button type="submit" class="btn primary">登录</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const API_BASE='https://liangzai666.com/monitor/api';const state={traders:[],status:null};const $=s=>document.querySelector(s);const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function toast(message,error=false){const node=$('#toast');node.textContent=message;node.className=`toast show${error?' error':''}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.className='toast',2600)}
    async function api(path,options={}){const password=sessionStorage.getItem('monitorPassword')||'';const response=await fetch(API_BASE+path.replace(/^\/api/,''),{headers:{'Content-Type':'application/json','X-Monitor-Password':password,...(options.headers||{})},...options});const body=await response.json().catch(()=>({}));if(response.status===401){sessionStorage.removeItem('monitorPassword');$('#login').showModal();throw new Error('管理密码不正确')}if(!response.ok)throw new Error(body.message||`请求失败 (${response.status})`);return body}
    function renderStatus(){const data=state.status||{},monitor=data.trade_monitor||{};$('#healthDot').classList.toggle('on',Boolean(monitor.running&&!monitor.last_error));$('#healthText').textContent=monitor.running?(monitor.last_error?'监控运行中，有采集异常':'监控运行正常'):'监控未运行';$('#accountCount').textContent=state.traders.filter(t=>t.enabled).length;$('#positionCount').textContent=(data.items||[]).filter(item=>item.hasPosition).length;$('#lastCycle').textContent=monitor.last_cycle?monitor.last_cycle.slice(11):'--';$('#hubStatus').textContent=monitor.hub_configured?'已连接':'未配置';$('#hubStatus').className=`stat-value ${monitor.hub_configured?'positive':'negative'}`;$('#refreshTime').textContent=data.last_refresh_time?`更新时间：${data.last_refresh_time}`:'尚未刷新';$('#monitorError').textContent=monitor.last_error?`最近异常：${monitor.last_error}`:'';const items=data.items||[];$('#positions').innerHTML=items.length?items.map(item=>{const p=item.position;if(!p)return `<article class="position"><div class="position-head"><a class="position-name" href="${escapeHtml(item.traderUrl)}" target="_blank">${escapeHtml(item.name)}</a><span class="badge okx">OKX · 空仓</span></div><div class="muted" style="margin-top:14px">当前没有公开持仓</div></article>`;const uplClass=String(p.uplRate).startsWith('-')?'negative':'positive';return `<article class="position"><div class="position-head"><a class="position-name" href="${escapeHtml(item.traderUrl)}" target="_blank">${escapeHtml(item.name)}</a><span class="badge okx">OKX · ${escapeHtml(p.dirLev)}</span></div><div class="position-main"><div class="metric"><span>交易对</span><strong>${escapeHtml(p.symbolBase)}</strong></div><div class="metric"><span>收益率</span><strong class="${uplClass}">${escapeHtml(p.uplRate)}</strong></div><div class="metric"><span>持仓值</span><strong>${escapeHtml(p.notionalWan)}</strong></div><div class="metric"><span>爆仓价</span><strong>${p.liqPx==='--'?'--':'$'+escapeHtml(p.liqPx)}</strong></div></div></article>`}).join(''):'<div class="empty">暂无 OKX 持仓数据。可在“名单与通知”中添加监控人。</div>'}
    function renderTraders(){const rows=$('#traderRows');rows.innerHTML=state.traders.length?state.traders.map(item=>{const channels=item.notifications.length?item.notifications.map(c=>`<span class="channel">${c==='wecom'?'企微':'邮箱'}</span>`).join(''):'<span class="muted">不通知</span>';return `<tr><td><strong>${escapeHtml(item.name)}</strong></td><td><span class="badge ${item.platform}">${item.platform.toUpperCase()}</span></td><td><code>${escapeHtml(item.identifier)}</code></td><td><div class="channels">${channels}</div></td><td class="${item.enabled?'status-on':'status-off'}">${item.enabled?'监控中':'已暂停'}</td><td><div class="actions"><button class="btn small" data-edit="${item.id}">编辑</button><button class="btn small danger" data-delete="${item.id}">删除</button></div></td></tr>`}).join(''):'<tr><td colspan="6" class="muted" style="text-align:center;padding:28px">还没有监控人，点击右上角添加。</td></tr>'}
    async function loadAll(){try{const[status,traders]=await Promise.all([api('/api/status'),api('/api/traders')]);state.status=status;state.traders=traders.items||[];renderStatus();renderTraders()}catch(error){toast(error.message,true);throw error}}
    function updateIdentifierLabel(){const okx=$('#platform').value==='okx';$('#identifierLabel').textContent=okx?'OKX uniqueName':'Binance portfolioId';$('#identifier').placeholder=okx?'带单员主页中的 uniqueName':'带单员主页中的 portfolioId'}
    function openEditor(item=null){$('#editorTitle').textContent=item?'编辑监控人':'添加监控人';$('#recordId').value=item?.id||'';$('#name').value=item?.name||'';$('#platform').value=item?.platform||'okx';$('#identifier').value=item?.identifier||'';$('#notifyWecom').checked=item?.notifications?.includes('wecom')||false;$('#notifyEmail').checked=item?.notifications?.includes('email')||false;$('#enabled').checked=item?item.enabled:true;updateIdentifierLabel();$('#editor').showModal();$('#name').focus()}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(node=>node.classList.toggle('active',node===tab));document.querySelectorAll('.view').forEach(view=>view.hidden=view.id!==tab.dataset.view)}));$('#addButton').addEventListener('click',()=>openEditor());$('#cancelButton').addEventListener('click',()=>$('#editor').close());$('#platform').addEventListener('change',updateIdentifierLabel);
    $('#traderRows').addEventListener('click',async event=>{const editId=event.target.dataset.edit,deleteId=event.target.dataset.delete;if(editId)openEditor(state.traders.find(item=>item.id===editId));if(deleteId){const item=state.traders.find(value=>value.id===deleteId);if(!confirm(`确定删除“${item.name}”吗？`))return;try{await api(`/api/traders/${deleteId}`,{method:'DELETE'});toast('已删除监控人');await loadAll()}catch(error){toast(error.message,true)}}});
    $('#editorForm').addEventListener('submit',async event=>{event.preventDefault();const id=$('#recordId').value,payload={name:$('#name').value,platform:$('#platform').value,identifier:$('#identifier').value,notifications:[$('#notifyWecom').checked?'wecom':'',$('#notifyEmail').checked?'email':''].filter(Boolean),enabled:$('#enabled').checked};try{await api(id?`/api/traders/${id}`:'/api/traders',{method:id?'PUT':'POST',body:JSON.stringify(payload)});$('#editor').close();toast(id?'监控人已更新':'监控人已添加');await loadAll()}catch(error){toast(error.message,true)}});
    $('#loginForm').addEventListener('submit',async event=>{event.preventDefault();sessionStorage.setItem('monitorPassword',$('#loginPassword').value);try{await loadAll();$('#login').close();$('#loginPassword').value=''}catch(_){}});
    if(sessionStorage.getItem('monitorPassword'))loadAll();else $('#login').showModal();setInterval(async()=>{if(!sessionStorage.getItem('monitorPassword'))return;try{state.status=await api('/api/status');renderStatus()}catch(_){}},5000);
  </script>
</body>
</html>
