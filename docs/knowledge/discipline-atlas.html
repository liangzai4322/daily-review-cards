  for(const r of displayed){const a=displayEndpoint(r.a),b=displayEndpoint(r.b);if(!a||!b||a.id===b.id||a.depth===0||b.depth===0)continue;const key=[a.id,b.id].sort().join('|');if(drawnCross.has(key))continue;drawnCross.add(key);const el=svg('path',{d:crossPath(a,b),class:'cross-edge'+(state.selected?' active':''),stroke:state.selected?byId.get(state.selected).color:'#9989bb'});$('cross-edges').append(el);edgeCount++;}
 }
 for(const n of nodes){if(!state.visible.has(n.id))continue;if(n.parent&&state.visible.has(n.parent))$('tree-edges').append(svg('path',{d:treePath(n),class:'tree-edge'+(state.selected?(connected.has(n.id)?' active':' dim'):''),stroke:n.color}));
  const r=radius(n),isSelected=state.selected===n.id;const g=svg('g',{transform:`translate(${n.x} ${n.y})`,class:'node'+(isSelected?' selected':'')+(state.selected&&!connected.has(n.id)?' dim':''),'data-id':n.id,role:'button',tabindex:'0','aria-label':`${n.name}，${['知识总览','知识领域','主要学科','研究方向'][n.depth]}，点击查看简介`,'aria-pressed':String(isSelected)});
  g.append(svg('circle',{r:r+7,fill:n.color||'#7060b5','fill-opacity':'.1',class:'node-halo'}));
  if(n.depth===0){g.append(svg('circle',{r,class:'node-shape',fill:'#fff',stroke:'#c9c0df','stroke-width':'1.4'}));g.append(svg('circle',{r:r-7,fill:'none',stroke:'#eeeaf7','stroke-width':'1'}));g.append(svg('text',{x:0,y:-8,'text-anchor':'middle',style:'font:10px var(--mono);letter-spacing:1.4px;fill:#9485b8'},'KNOWLEDGE'));g.append(svg('text',{x:0,y:16,'text-anchor':'middle',style:'font:500 23px var(--display);fill:#5b4c88'},'人类知识'));}
  else if(n.depth===1){g.append(svg('circle',{r,class:'node-shape',fill:'#fff',stroke:n.color,'stroke-width':'1.6'}));g.append(svg('circle',{r:r-5,fill:n.color,'fill-opacity':'.065'}));g.append(svg('text',{y:5,'text-anchor':'middle',style:`font:500 13px var(--mono);fill:${n.color}`},String(subtreeWeight(n.id))));g.append(svg('text',{x:0,y:r+25,'text-anchor':'middle',class:'node-text','font-size':'21',fill:n.color},n.name));}
  else {g.append(svg('circle',{r:Math.max(r+7,18),fill:'transparent'}));g.append(svg('circle',{r,class:'node-shape',fill:isSelected?n.color:'#fff',stroke:n.color,'stroke-width':n.depth===2?'2':'1.5'}));const left=Math.cos(n.angle*Math.PI/180)<-.06;const angle=left?n.angle+180:n.angle;const text=svg('text',{transform:`rotate(${angle})`,x:left?-r-9:r+9,y:'6','text-anchor':left?'end':'start',class:'node-text','font-size':n.depth===2?'21':'18'} ,n.name);g.append(text);}
  g.append(svg('title',{},`${n.name}\n${n.summary}`));g.addEventListener('click',()=>{if(!dragMoved)selectNode(n.id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(n.id);}});$('nodes').append(g);

function updateDirectory(){for(const b of document.querySelectorAll('[data-id]')){if(b.closest('#family-list'))b.classList.toggle('selected',b.dataset.id===state.selected);} }
function renderGuide(){
 const c=$('detail-content');c.replaceChildren();const eyebrow=make('div','detail-eyebrow');const dot=make('i','tiny-dot');dot.style.background='var(--accent)';eyebrow.append(dot,'地图阅读指南');c.append(eyebrow,make('h2','', '知识，有脉络。'),make('div','english-name','EVERY DISCIPLINE IS A DOORWAY'),make('p','detail-intro',`从 ${families.length} 个知识领域、${subjectCount} 门主要学科出发，探索 ${leafCount} 个研究方向和 ${relations.length} 组学科联系。点击任何节点，打开一扇新的门。`),make('div','intro-divider'));
 const steps=make('div','guide-steps');for(const [icon,title,desc] of [['◎','由大到小，逐层深入','中心是知识总览，向外依次是领域、主要学科与研究方向。'],['⌁','跨越边界，寻找联系','实线表示包含与分支；虚线表示方法支撑、交叉研究、共同问题或应用转化。'],['↗','点击一门学科，读懂它','查看简介、典型问题、常用方法、分支及相关学科。选中后，地图突出相关联系。']]){const step=make('div','guide-step');const text=make('div');text.append(make('strong','',title),make('p','',desc));step.append(make('span','guide-icon',icon),text);steps.append(step);}c.append(steps);
 const sec=make('section','detail-section');sec.append(make('h3','','从这些交叉点开始'));const rec=make('div','recommended');for(const [id,label]of [['ai','人工智能 × 语言 × 认知'],['public-health','公共卫生 × 统计 × 社会'],['architecture','建筑 × 工程 × 人居环境']]){const b=button('','recommend-button',()=>{selectNode(id);ensureVisible(id);});b.append(make('span','',label),make('span','','↗'));rec.append(b);}sec.append(rec);c.append(sec);
 c.append(make('p','scope-note','这是一份探索性的知识地图，不是官方学科目录。学科划分因国家、机构和研究传统而异；树上的位置是一种阅读归属，并非排他的分类。节点大小表示层级与分支规模，不表示重要性、难度或学科价值。连线是精选关系，未画线不等于没有联系。'));

function detailSection(title){const s=make('section','detail-section');s.append(make('h3','',title));return s;}
function renderDetail(id){
 const n=byId.get(id);if(id==='knowledge'){renderGuide();return;}const c=$('detail-content');c.replaceChildren();const f=familyOf(id);const eyebrow=make('div','detail-eyebrow');const dot=make('i','tiny-dot');dot.style.background=n.color;eyebrow.append(dot,`${f.name} / ${n.depth===1?'知识领域':n.depth===2?'主要学科':'研究方向'}`);c.append(eyebrow,make('h2','',n.name));if(n.en)c.append(make('div','english-name',n.en));c.append(make('p','detail-intro',n.summary));
 const crumb=make('div','breadcrumb');const path=ancestors(id);path.forEach((pid,i)=>{if(i)crumb.append(make('span','','›'));if(pid===id)crumb.append(make('span','',byId.get(pid).name));else crumb.append(button(byId.get(pid).name,'',()=>{selectNode(pid);ensureVisible(pid);}));});c.append(crumb);
 if(n.question){const s=detailSection('它关心什么');s.append(make('p','',n.question));c.append(s);}const m=n.methods||(n.depth===3?byId.get(n.parent).methods:null);if(m){const s=detailSection(n.depth===3?'所属学科的常用方法':'常用方法');const tags=make('div','detail-tags');for(const t of m)tags.append(make('span','detail-tag',t));s.append(tags);c.append(s);}
 if(n.children.length){const s=detailSection(n.depth===1?'主要学科 · '+n.children.length:'继续深入 · '+n.children.length);const grid=make('div','child-grid');for(const cid of n.children)grid.append(button(byId.get(cid).name,'child-link',()=>{selectNode(cid);ensureVisible(cid);}));s.append(grid);c.append(s);}
 const related=getRelations(id);if(related.length){const s=detailSection(`跨学科连接 · ${related.length}`);const scope=new Set(descend(id));for(const r of related){const other=scope.has(r.a)?r.b:r.a;const target=byId.get(other);const b=button('','related-link',()=>{selectNode(other);ensureVisible(other);});const heading=make('div','related-heading');const dot=make('i','family-dot');dot.style.background=target.color;heading.append(dot,make('span','',target.name),make('span','related-type',r.type));b.append(heading,make('div','related-reason',r.reason));s.append(b);}c.append(s);}
 else{const s=detailSection('探索相邻知识');s.append(make('p','',n.depth===3?'此方向暂无单独绘制的交叉连线，可进入所属学科查看更广的联系。':'从下方分支继续探索具体研究方向与跨学科关系。'));if(n.depth===3)s.append(button('查看'+byId.get(n.parent).name+'的联系','child-link',()=>{selectNode(n.parent);ensureVisible(n.parent);}));c.append(s);}
 const actions=make('div','detail-actions');if(n.children.length)actions.append(button('聚焦这条分支','action-button primary',()=>focusBranch(id)));actions.append(button('定位到地图','action-button',()=>{ensureVisible(id);if(window.innerWidth<=680)$('inspector').classList.remove('is-open');}));c.append(actions);c.append(make('p','scope-note','分类用于阅读与探索；连线为代表性关系，并非穷尽所有联系。'));$('inspector').scrollTop=0;
}
function selectNode(id,{open=true}={}){if(!byId.has(id))return;if(id==='knowledge'){state.selected=null;renderGuide();}else{state.selected=id;renderDetail(id);}renderMap();if(open)$('inspector').classList.add('is-open');$('selection-status').textContent=id==='knowledge'?'知识地图总览':`已选择${byId.get(id).name}。${byId.get(id).summary}`;}
function setDepth(depth,{fit=true}={}){state.depth=depth;for(const b of document.querySelectorAll('[data-depth]')){const active=Number(b.dataset.depth)===depth;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));}renderMap();if(fit)fitMap();}
function focusBranch(id){state.focus=id;setDepth(Math.min(3,byId.get(id).depth+1));fitMap();if(window.innerWidth<=1000)$('inspector').classList.remove('is-open');}
function resetMap(){state.selected=null;state.focus=null;state.cross=true;$('cross-toggle').setAttribute('aria-pressed','true');setDepth(window.innerWidth<=680?1:2);renderGuide();$('inspector').classList.remove('is-open');$('search').value='';hideSearch();toggleDirectory(false);}
function updateTransform(){const v=state.view;$('world').setAttribute('transform',`translate(${v.x},${v.y}) scale(${v.k})`);$('zoom-value').textContent=Math.round(v.k*100)+'%';}
function fitMap(){const ns=[...state.visible].map(id=>byId.get(id));const ext=ns.map(n=>({x:n.x,y:n.y,pad:n.depth===1?85:n.depth===0?65:n.depth===3?165:160}));const minX=Math.min(...ext.map(n=>n.x-n.pad)),maxX=Math.max(...ext.map(n=>n.x+n.pad)),minY=Math.min(...ext.map(n=>n.y-n.pad)),maxY=Math.max(...ext.map(n=>n.y+n.pad));const availableHeight=Math.max(180,state.height-112);const k=Math.max(.14,Math.min(1.5,(state.width-36)/(maxX-minX),availableHeight/(maxY-minY)));state.view={k,x:state.width/2-(maxX+minX)*.5*k,y:state.height*.54-(maxY+minY)*.5*k};updateTransform();}
function zoom(factor,x=state.width/2,y=state.height/2){const v=state.view;const k=Math.max(.14,Math.min(3.5,v.k*factor));const ratio=k/v.k;state.view={k,x:x-(x-v.x)*ratio,y:y-(y-v.y)*ratio};updateTransform();}
function ensureVisible(id){const n=byId.get(id);const leavingFocus=state.focus&&!state.visible.has(id);if(leavingFocus)state.focus=null;if(n.depth>state.depth)setDepth(n.depth,{fit:n.depth<3});else{renderMap();if(leavingFocus&&n.depth<3)fitMap();}if(id==='knowledge'){fitMap();return;}const sx=n.x*state.view.k+state.view.x,sy=n.y*state.view.k+state.view.y;if(n.depth<3&&sx>45&&sx<state.width-45&&sy>50&&sy<state.height-40)return;const k=Math.max(state.view.k,n.depth===3?1.05:.65);state.view={k,x:state.width*.5-n.x*k,y:state.height*.5-n.y*k};updateTransform();}
function toggleDirectory(open){$('directory').classList.toggle('is-open',open);$('mobile-backdrop').classList.toggle('is-open',open);$('open-directory').setAttribute('aria-expanded',String(open));}
function normalize(s){return s.toLowerCase().replace(/[\s–—-]/g,'');}
function renderSearch(){const q=normalize($('search').value.trim());const list=$('search-results');list.replaceChildren();state.searchIndex=-1;if(!q){hideSearch();return;}state.searchMatches=nodes.filter(n=>n.depth>0&&normalize(n.name+' '+(n.en||'')+' '+(n.summary||'')).includes(q)).sort((a,b)=>{const exact=(n)=>normalize(n.name)===q?0:normalize(n.name).startsWith(q)?1:normalize(n.name+(n.en||'')).includes(q)?2:3;return exact(a)-exact(b)||a.depth-b.depth;}).slice(0,16);list.hidden=false;$('search').setAttribute('aria-expanded','true');if(!state.searchMatches.length){list.append(make('div','empty-search','没有找到这个学科。试试更短的关键词，例如“认知”或“材料”。'));return;}
 state.searchMatches.forEach((n,i)=>{const b=button('','search-result',()=>chooseSearch(i));b.setAttribute('role','option');b.setAttribute('aria-selected','false');b.id='search-option-'+i;const dot=make('i','result-dot');dot.style.background=n.color;const text=make('div');text.append(make('div','result-name',n.name),make('div','result-path',ancestors(n.id).slice(1,-1).map(id=>byId.get(id).name).join(' › ')||'知识领域'));b.append(dot,text);list.append(b);});
}
function hideSearch(){$('search-results').hidden=true;$('search').setAttribute('aria-expanded','false');$('search').removeAttribute('aria-activedescendant');}
function chooseSearch(i){const n=state.searchMatches[i];if(!n)return;$('search').value=n.name;hideSearch();selectNode(n.id);ensureVisible(n.id);$('search').blur();}
$('search').addEventListener('input',renderSearch);$('search').addEventListener('focus',()=>{if($('search').value.trim())renderSearch();});$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){hideSearch();return;}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!state.searchMatches.length)return;state.searchIndex=(state.searchIndex+(e.key==='ArrowDown'?1:-1)+state.searchMatches.length)%state.searchMatches.length;[...$('search-results').children].forEach((el,i)=>{el.classList.toggle('active',i===state.searchIndex);el.setAttribute('aria-selected',String(i===state.searchIndex));if(i===state.searchIndex){el.scrollIntoView({block:'nearest'});$('search').setAttribute('aria-activedescendant',el.id);}});}else if(e.key==='Enter'&&state.searchMatches.length){e.preventDefault();chooseSearch(Math.max(0,state.searchIndex));}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideSearch();});
for(const b of document.querySelectorAll('[data-depth]'))b.addEventListener('click',()=>setDepth(Number(b.dataset.depth)));
$('cross-toggle').addEventListener('click',()=>{state.cross=!state.cross;$('cross-toggle').setAttribute('aria-pressed',String(state.cross));renderMap();});$('zoom-in').addEventListener('click',()=>zoom(1.3));$('zoom-out').addEventListener('click',()=>zoom(1/1.3));$('fit').addEventListener('click',fitMap);$('all-disciplines').addEventListener('click',resetMap);$('leave-focus').addEventListener('click',()=>{state.focus=null;renderMap();fitMap();});$('show-guide').addEventListener('click',()=>{state.selected=null;renderGuide();renderMap();$('inspector').classList.add('is-open');});$('close-inspector').addEventListener('click',()=>{$('inspector').classList.remove('is-open');const selected=$('nodes').querySelector(`[data-id="${state.selected||'knowledge'}"]`);if(selected)selected.focus({preventScroll:true});});$('open-directory').addEventListener('click',()=>toggleDirectory(!$('directory').classList.contains('is-open')));$('mobile-backdrop').addEventListener('click',()=>toggleDirectory(false));
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='/'){e.preventDefault();$('search').focus();}if(e.key==='Escape'){hideSearch();toggleDirectory(false);$('inspector').classList.remove('is-open');}if(e.key==='f'||e.key==='F')fitMap();if(e.key==='+'||e.key==='=')zoom(1.2);if(e.key==='-')zoom(1/1.2);});
let dragMoved=false;let pointerStart=null;let pinchStart=null;let pinchUsed=false;const pointers=new Map();const graph=$('graph');
function localPoint(e){const rect=graph.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top};}
graph.addEventListener('wheel',e=>{e.preventDefault();const p=localPoint(e);zoom(Math.exp(-e.deltaY*.0015),p.x,p.y);},{passive:false});
graph.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;const p=localPoint(e);pointers.set(e.pointerId,p);dragMoved=false;pinchUsed=false;pointerStart={...p,v:{...state.view}};graph.setPointerCapture(e.pointerId);if(pointers.size===2){pinchUsed=true;const [a,b]=[...pointers.values()];pinchStart={distance:Math.hypot(a.x-b.x,a.y-b.y),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v:{...state.view}};}graph.classList.add('is-dragging');});
graph.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,localPoint(e));if(pointers.size===2&&pinchStart){dragMoved=true;pinchUsed=true;const [a,b]=[...pointers.values()];const k=Math.max(.14,Math.min(3.5,pinchStart.v.k*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinchStart.distance)));const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const ratio=k/pinchStart.v.k;state.view={k,x:mid.x-(pinchStart.mid.x-pinchStart.v.x)*ratio,y:mid.y-(pinchStart.mid.y-pinchStart.v.y)*ratio};updateTransform();}else if(pointerStart){const p=localPoint(e),dx=p.x-pointerStart.x,dy=p.y-pointerStart.y;if(Math.hypot(dx,dy)>4){dragMoved=true;state.view={...pointerStart.v,x:pointerStart.v.x+dx,y:pointerStart.v.y+dy};updateTransform();}}});
function endPointer(e){pointers.delete(e.pointerId);if(!pointers.size){graph.classList.remove('is-dragging');pointerStart=null;pinchStart=null;if(!dragMoved&&!pinchUsed){const hit=document.elementFromPoint(e.clientX,e.clientY);const n=hit&&hit.closest('.node');if(n){selectNode(n.dataset.id);dragMoved=true;}}}else{const p=[...pointers.values()][0];pointerStart={...p,v:{...state.view}};pinchStart=null;}}
graph.addEventListener('pointerup',endPointer);graph.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pointerStart=null;pinchStart=null;dragMoved=true;graph.classList.remove('is-dragging');});
layout();renderDirectory();renderGuide();setDepth(state.depth,{fit:false});
const resizeObserver=new ResizeObserver(()=>{const rect=$('graph-shell').getBoundingClientRect();const oldWidth=state.width,oldHeight=state.height;state.width=rect.width;state.height=rect.height;graph.setAttribute('viewBox',`0 0 ${state.width} ${state.height}`);if(!oldWidth)fitMap();else{state.view.x+=(state.width-oldWidth)/2;state.view.y+=(state.height-oldHeight)/2;updateTransform();}});resizeObserver.observe($('graph-shell'));
</script>
