<!doctype html><html lang="zh-CN"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>学科星图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600;700;900&display=swap">
<style>
/* Layout: full-screen atlas — chart stage on the left, catalogue panel on the right (bottom sheet on phones) */
:root{
  --paper:#EEF1F4; --surface:#F9FAFB; --ink:#172031; --ink2:#556074; --ink3:#8590A2;
  --rule:#D3DAE3; --grid:#D9DFE7; --link:#5B6678; --halo:#EEF1F4;
  --dF:#4A4FC2; --dE:#C9631A; --dN:#1E73AE; --dL:#2C8550; --dM:#C3364B; --dS:#9A7609; --dH:#9C3A8B;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --latin:"EB Garamond","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ui:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --panel-w:390px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1322; --surface:#131A2C; --ink:#E6E9F0; --ink2:#A2ABBC; --ink3:#6F7A8F;
  --rule:#26304A; --grid:#1A2238; --link:#9AA6BC; --halo:#0D1322;
  --dF:#A2A6FF; --dE:#FFA868; --dN:#6DB9EE; --dL:#72D39C; --dM:#FF8A97; --dS:#E7C55E; --dH:#E68FD6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1322; --surface:#131A2C; --ink:#E6E9F0; --ink2:#A2ABBC; --ink3:#6F7A8F;
  --rule:#26304A; --grid:#1A2238; --link:#9AA6BC; --halo:#0D1322;
  --dF:#A2A6FF; --dE:#FFA868; --dN:#6DB9EE; --dL:#72D39C; --dM:#FF8A97; --dS:#E7C55E; --dH:#E68FD6;
  color-scheme:dark}
.dom-F{--c:var(--dF)} .dom-E{--c:var(--dE)} .dom-N{--c:var(--dN)} .dom-L{--c:var(--dL)}
.dom-M{--c:var(--dM)} .dom-S{--c:var(--dS)} .dom-H{--c:var(--dH)}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.06em;line-height:1.1}
.brand p{margin:0;font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.views{display:flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.views button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink2);white-space:nowrap}
.views button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.views button:hover:not([aria-selected="true"]){color:var(--ink)}
.search{position:relative;margin-left:auto;width:min(320px,100%)}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px 8px 32px;font:14px var(--ui)}
.search input::placeholder{color:var(--ink3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink3);fill:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,16,30,.18);max-height:340px;overflow:auto;z-index:20}
.results li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:14px}
.results li button:hover,.results li button.on{background:var(--paper)}
.results .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.results small{color:var(--ink3);margin-left:auto;font-size:12px;white-space:nowrap}
.results .empty{padding:10px;color:var(--ink2);font-size:13px}

/* stage */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#viz{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#viz:active{cursor:grabbing}
.legend{position:absolute;left:16px;bottom:16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;max-width:min(300px,calc(100% - 32px));box-sizing:border-box}
.legend h4{margin:0 0 8px;font:600 11px var(--ui);letter-spacing:.14em;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip b{font:500 11px var(--mono);color:var(--ink3)}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.keys{display:flex;gap:18px;margin-top:12px;align-items:flex-end;flex-wrap:wrap}
.keys svg{display:block;overflow:visible}
.keys text{font:10px var(--mono);fill:var(--ink2)}
.keys .k-label{font:11px var(--ui);fill:var(--ink3)}
.zoomctl{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoomctl button{border:0;background:none;width:34px;height:34px;font-size:17px;line-height:1;color:var(--ink2)}
.zoomctl button+button{border-top:1px solid var(--rule)}
.zoomctl button:hover{color:var(--ink);background:var(--paper)}
.caption{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--ink3);text-align:right;max-width:260px;line-height:1.5;pointer-events:none}

/* svg vocabulary */
.grat{fill:none;stroke:var(--grid);stroke-width:1}
.grat.dash{stroke-dasharray:2 5}
.grat-label{font:10px var(--mono);fill:var(--ink3);letter-spacing:.08em}
.lk{fill:none;stroke:var(--link);stroke-linecap:round;transition:opacity .2s}
.lk.same{stroke:var(--c)}
.node circle.core{fill:var(--c);stroke:var(--halo);stroke-width:1.5}
.node circle.ring{fill:none;stroke:var(--c);stroke-width:.8;opacity:.45}
.node text,.lab{font-family:var(--serif);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node{cursor:pointer;transition:opacity .2s}
.dom-title{font-family:var(--serif);font-weight:900;fill:var(--c);opacity:.16;letter-spacing:.2em;pointer-events:none}
.dom-en{font-family:var(--latin);font-style:italic;fill:var(--c);opacity:.5;pointer-events:none}
.bridge{font:11px var(--ui);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.dim .node:not(.hi){opacity:.13}
.dim .lk:not(.hi){opacity:.03!important}
.node.sel circle.core{stroke:var(--ink);stroke-width:2.5}
.pk{cursor:pointer}
.pk-dom{fill:var(--c);fill-opacity:.07;stroke:var(--c);stroke-opacity:.5}
.pk-disc{fill:var(--c);fill-opacity:.24;stroke:var(--c);stroke-opacity:.6}
.pk-br{fill:var(--surface);stroke:var(--c);stroke-opacity:.55}
.pk:hover{stroke-width:2;stroke-opacity:1}
.pk.sel{stroke:var(--ink);stroke-width:2.5;stroke-opacity:1}
.pk-label{font-family:var(--serif);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.pk-dlabel{font-family:var(--serif);font-weight:900;fill:var(--c);letter-spacing:.3em;pointer-events:none;paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.ring-arc{fill:var(--c);opacity:.85}
.ring-name{font-family:var(--serif);font-weight:900;fill:var(--c);letter-spacing:.25em;pointer-events:none}
.leaf text{font-family:var(--serif);fill:var(--ink);cursor:pointer}
.leaf circle{fill:var(--c)}
.leaf.hi text{font-weight:700}
.leaf.sel text{font-weight:900;text-decoration:underline}
.ringdim .leaf:not(.hi){opacity:.25}

#tip{position:fixed;pointer-events:none;z-index:30;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.45;max-width:240px;opacity:0;transition:opacity .12s}
#tip b{font-family:var(--serif);font-size:14px}
#tip em{font-family:var(--latin);opacity:.8}

/* catalogue panel */
#panel{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;min-height:0;position:relative}
.p-inner{padding:22px 24px 40px;display:flex;flex-direction:column;gap:16px}
.p-close{display:none}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);letter-spacing:.06em}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.eyebrow .code{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--rule);border-radius:4px;padding:2px 6px;color:var(--ink2)}
#panel h2{margin:0;font-family:var(--serif);font-weight:900;font-size:32px;line-height:1.15;text-wrap:balance}
.en{margin:-10px 0 0;font-family:var(--latin);font-style:italic;font-size:18px;color:var(--ink2)}
.full{margin:-8px 0 0;font-size:12px;color:var(--ink3)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.metrics div{padding:10px 0;display:flex;flex-direction:column;gap:2px}
.metrics div+div{border-left:1px solid var(--rule);padding-left:12px}
.metrics strong{font:500 20px var(--mono);font-variant-numeric:tabular-nums;color:var(--c)}
.metrics span{font-size:11px;color:var(--ink3)}
.intro{margin:0;font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--ink)}
#panel h3{margin:8px 0 0;font:600 12px var(--ui);letter-spacing:.14em;color:var(--ink3);display:flex;gap:8px;align-items:baseline}
#panel h3 small{font:500 11px var(--mono);letter-spacing:0}
.branches,.links,.rank{list-style:none;margin:0;padding:0}
.branches li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px;line-height:1.5}
.branches li b{font-family:var(--serif);font-weight:600;color:var(--ink)}
.branches li span{color:var(--ink2)}
.branches li.flash{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;padding-left:6px;margin-left:-6px}
.links li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;min-width:0}
.links button,.rank button{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:600;font-size:14px;white-space:nowrap}
.links button:hover,.rank button:hover{text-decoration:underline;text-underline-offset:3px}
.links button i,.rank button i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.links .via{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.links .w{margin-left:auto;flex:none;display:flex;gap:2px}
.links .w s{width:4px;height:10px;border-radius:1px;background:var(--rule)}
.links .w s.on{background:var(--ink2)}
.rank li{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.rank .barw{height:6px;background:var(--paper);border-radius:3px;overflow:hidden}
.rank .barw span{display:block;height:100%;background:var(--c);border-radius:3px}
.rank em{font:500 11px var(--mono);font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;min-width:4.5em}
.lede{margin:0;font-family:var(--serif);font-size:15px;line-height:1.85}
.note{margin:0;font-size:12px;line-height:1.7;color:var(--ink3);border-top:1px solid var(--rule);padding-top:12px}
.back{align-self:flex-start;border:1px solid var(--rule);background:none;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}

@media (max-width:820px){
  :root{--panel-w:0px}
  #app{grid-template-columns:minmax(0,1fr)}
  .bar{gap:10px 12px;padding:10px 16px}
  .brand h1{font-size:20px}
  .brand p{display:none}
  .search{order:3;width:100%;margin-left:0}
  .views{margin-left:auto}
  .views button{padding:5px 11px}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:66%;border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(10,16,30,.25);transform:translateY(105%);transition:transform .28s ease;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .p-inner{padding:16px 16px 32px}
  .p-close{display:block;position:sticky;top:0;margin:-4px 0 -8px auto;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2);z-index:2}
  #panel h2{font-size:26px}
  .legend{left:16px;right:16px;bottom:12px;max-width:none;padding:10px 12px}
  .legend h4,.keys{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .caption{display:none}
  .zoomctl{top:12px;right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<div id="app">
  <header class="bar">
    <div class="brand"><h1>学科星图</h1><p id="sub"></p></div>
    <nav class="views" role="tablist" aria-label="切换视图">
      <button type="button" role="tab" data-v="star" aria-selected="true">星图</button>
      <button type="button" role="tab" data-v="pack" aria-selected="false">层级圆</button>
      <button type="button" role="tab" data-v="ring" aria-selected="false">关系环</button>
    </nav>
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke-width="1.6"/></svg>
      <input id="q" type="search" placeholder="搜索学科或分支，如：博弈论" autocomplete="off" aria-label="搜索学科或分支">
      <ul class="results" id="results" hidden></ul>
    </div>
  </header>
  <main id="stage">
    <svg id="viz" role="img" aria-label="学科之间的连接与体量关系图"></svg>
    <div class="legend"><h4>图例 · 七大门类</h4><div class="chips" id="chips"></div><div class="keys" id="keys"></div></div>
    <div class="zoomctl"><button type="button" id="zin" aria-label="放大">+</button><button type="button" id="zout" aria-label="缩小">−</button><button type="button" id="zreset" aria-label="复位视图">⟲</button></div>
    <div class="caption" id="caption"></div>
  </main>
  <aside id="panel" aria-label="学科简介"><div class="p-inner" id="pinner"></div></aside>
</div>
<div id="tip" role="tooltip"></div>
<script>

// ---------- data ----------
const DOMAINS=[
  {k:'F',name:'形式科学',en:'Formal Sciences'},
  {k:'E',name:'工程技术',en:'Engineering & Technology'},
  {k:'N',name:'自然科学',en:'Natural Sciences'},
  {k:'L',name:'生命科学',en:'Life & Agricultural Sciences'},
  {k:'M',name:'医学健康',en:'Medicine & Health'},
  {k:'S',name:'社会科学',en:'Social Sciences'},
  {k:'H',name:'人文艺术',en:'Humanities & Arts'}
];
const DOM=Object.fromEntries(DOMAINS.map((d,i)=>[d.k,Object.assign(d,{i})]));
const NODES=DISC.map((d,i)=>({id:d[0],dom:d[1],name:d[2],en:d[3],size:d[4],code:d[5],intro:d[6],
  branches:d[7].split(';').map(s=>{const p=s.split(':');return{n:p[0],g:p[1]}}),full:d[8]||'',idx:i,adj:[]}));
NODES.sort((a,b)=>DOM[a.dom].i-DOM[b.dom].i||a.idx-b.idx);
const BY=Object.fromEntries(NODES.map(n=>[n.id,n]));
const LINKS=LINKS_RAW.trim().split('\n').map(l=>{const p=l.trim().split(' ');return{a:p[0],b:p[1],w:+p[2],via:p.slice(3).join(' ')}});
LINKS.forEach(l=>{BY[l.a].adj.push({id:l.b,w:l.w,via:l.via});BY[l.b].adj.push({id:l.a,w:l.w,via:l.via})});
[...NODES].sort((a,b)=>b.size-a.size).forEach((n,i)=>n.rank=i+1);
DOMAINS.forEach(d=>{const ns=NODES.filter(n=>n.dom===d.k);d.count=ns.length;d.total=ns.reduce((s,n)=>s+n.size,0)});
const TOTAL_BR=NODES.reduce((s,n)=>s+n.branches.length,0);
const MAXSIZE=Math.max(...NODES.map(n=>n.size));

function fmtSize(k){
  if(k>=10){const w=k/10;return{num:'≈'+(Number.isInteger(w)?w:w.toFixed(1)),unit:'万篇/年'}}
  return{num:'≈'+(k*1000).toLocaleString('zh-CN'),unit:'篇/年'}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR=reduceMotion?0:650;

// ---------- state ----------
const S={view:'star',sel:null,branch:null,focusDom:null};
const VIEWS={};
const svg=d3.select('#viz');
const stage=document.getElementById('stage');
const panel=document.getElementById('panel');
const pin=document.getElementById('pinner');
const isNarrow=()=>matchMedia('(max-width:820px)').matches;
function stageSize(){const r=stage.getBoundingClientRect();return{W:Math.max(280,r.width),H:Math.max(280,r.height)}}

// ---------- tooltip ----------
const tip=document.getElementById('tip');
function showTip(ev,n,extra){
  if(isNarrow())return;
  const f=fmtSize(n.size);
  tip.innerHTML=`<b>${esc(n.name)}</b> <em>${esc(n.en)}</em><br>${f.num} ${f.unit} · ${n.adj.length} 条交叉连接${extra?'<br>'+esc(extra):''}`;
  const x=Math.min(ev.clientX+14,innerWidth-250),y=Math.min(ev.clientY+14,innerHeight-80);
  tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;
}
function hideTip(){tip.style.opacity=0}

// ---------- selection ----------
function select(id,opts={}){
  S.sel=id||null;S.branch=opts.branch||null;
  if(id)S.focusDom=null;
  syncChips();
  VIEWS[S.view].apply&&VIEWS[S.view].apply();
  if(id&&opts.center!==false)VIEWS[S.view].center&&VIEWS[S.view].center(id);
  if(id)showDisc(id);else showOverview();
  if(id)panel.classList.add('open');else if(isNarrow())panel.classList.remove('open');
  try{history.replaceState(null,'',id?'#'+id:location.pathname+location.search)}catch(e){}
}
function focusDomain(k){
  S.focusDom=S.focusDom===k?null:k;
  if(S.focusDom){S.sel=null;S.branch=null;showOverview()}
  syncChips();
  VIEWS[S.view].focusDom&&VIEWS[S.view].focusDom(S.focusDom);
}
// neighbourhood used for highlighting
function hood(id){const s=new Set([id]);BY[id].adj.forEach(a=>s.add(a.id));return s}

// ---------- panel ----------
function domEyebrow(n){
  const d=DOM[n.dom];
  return `<div class="eyebrow dom-${n.dom}"><i></i>${d.name}<span style="color:var(--ink3)">${d.en}</span>${n.code?`<span class="code">学科代码 ${esc(n.code)}</span>`:''}</div>`;
}
function showDisc(id){
  const n=BY[id],f=fmtSize(n.size);
  const adj=[...n.adj].sort((a,b)=>b.w-a.w||BY[b.id].size-BY[a.id].size);
  pin.innerHTML=`
  <button class="p-close" type="button" data-close>收起</button>
  ${domEyebrow(n)}
  <h2>${esc(n.name)}</h2>
  <p class="en">${esc(n.en)}</p>
  ${n.full&&n.full!==n.name?`<p class="full">学科全称：${esc(n.full)}</p>`:''}
  <div class="metrics dom-${n.dom}">
    <div><strong>${f.num}</strong><span>${f.unit}（估算）</span></div>
    <div><strong>#${n.rank}</strong><span>体量排名 / ${NODES.length}</span></div>
    <div><strong>${n.adj.length}</strong><span>交叉连接</span></div>
  </div>
  <p class="intro">${esc(n.intro)}</p>
  <h3>主要分支 <small>${n.branches.length}</small></h3>
  <ul class="branches dom-${n.dom}">${n.branches.map(b=>`<li${b.n===S.branch?' class="flash"':''}><b>${esc(b.n)}</b><span>${esc(b.g)}</span></li>`).join('')}</ul>
  <h3>交叉连接 <small>${adj.length}</small></h3>
  <ul class="links">${adj.map(a=>{const m=BY[a.id];return`<li><button type="button" class="dom-${m.dom}" data-go="${m.id}"><i></i>${esc(m.name)}</button><span class="via">${esc(a.via)}</span><span class="w" title="联系强度 ${a.w}/3">${[1,2,3].map(i=>`<s class="${i<=a.w?'on':''}"></s>`).join('')}</span></li>`}).join('')}</ul>
  <button class="back" type="button" data-overview>← 返回导览</button>`;
  panel.scrollTop=0;
  const fl=pin.querySelector('.flash');if(fl)fl.scrollIntoView({block:'center'});
}
function rankList(list,val,label){
  const mx=Math.max(...list.map(val));
  return `<ul class="rank">${list.map(n=>`<li class="dom-${n.dom}"><button type="button" class="dom-${n.dom}" data-go="${n.id}"><i></i>${esc(n.name)}</button><span class="barw"><span style="width:${(val(n)/mx*100).toFixed(1)}%"></span></span><em>${label(n)}</em></li>`).join('')}</ul>`;
}
function showOverview(){
  const bySize=[...NODES].sort((a,b)=>b.size-a.size).slice(0,8);
  const byDeg=[...NODES].sort((a,b)=>b.adj.length-a.adj.length).slice(0,6);
  const domRows=DOMAINS.map(d=>({id:null,dom:d.k,name:d.name,total:d.total,count:d.count}));
  const mx=Math.max(...domRows.map(d=>d.total));
  pin.innerHTML=`
  <button class="p-close" type="button" data-close>收起</button>
  <div class="eyebrow">导览</div>
  <h2>${S.focusDom?DOM[S.focusDom].name:'人类知识的版图'}</h2>
  <p class="lede">${S.focusDom?`${DOM[S.focusDom].name}共收录 ${DOM[S.focusDom].count} 个学科，估算年论文量约 ${Math.round(DOM[S.focusDom].total/10)} 万篇。图中已突出显示这一门类及其对外连接。`:
  `这张图收录 ${NODES.length} 个学科、${TOTAL_BR} 个分支和 ${LINKS.length} 条交叉连接。圆点越大，表示该学科每年发表的论文越多；连线表示两个学科之间存在成熟的交叉领域，线越粗联系越紧密。点击任意学科查看简介。`}</p>
  <h3>七大门类 <small>按估算年论文量</small></h3>
  <ul class="rank">${domRows.map(d=>`<li class="dom-${d.dom}"><button type="button" class="dom-${d.dom}" data-dom="${d.dom}"><i></i>${d.name}</button><span class="barw"><span style="width:${(d.total/mx*100).toFixed(1)}%"></span></span><em>${d.count} 科</em></li>`).join('')}</ul>
  <h3>体量最大的学科</h3>
  ${rankList(S.focusDom?[...NODES].filter(n=>n.dom===S.focusDom).sort((a,b)=>b.size-a.size).slice(0,8):bySize,n=>n.size,n=>{const f=fmtSize(n.size);return f.num.replace('≈','')+(f.unit[0]==='万'?' 万':'')})}
  <h3>连接最多的学科</h3>
  ${rankList(S.focusDom?[...NODES].filter(n=>n.dom===S.focusDom).sort((a,b)=>b.adj.length-a.adj.length).slice(0,6):byDeg,n=>n.adj.length,n=>n.adj.length+' 条')}
  <p class="note">体量为估算值，仅用于比较相对大小：以美国国家科学基金会《科学与工程指标》统计的 2022 年全球约 334 万篇科技论文及各领域占比为基准（健康科学约四分之一、工程 17%、生物医学 13%、社会科学 5%），再按学科细分估算；人文艺术类不在该统计内，为另行估算。学科代码取自中国《研究生教育学科专业目录（2022 年）》，仅标注一一对应的学科。</p>`;
}
pin.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){select(go.dataset.go);return}
  const dm=e.target.closest('[data-dom]');if(dm){focusDomain(dm.dataset.dom);return}
  if(e.target.closest('[data-overview]')){select(null);return}
  if(e.target.closest('[data-close]'))panel.classList.remove('open');
});

// ---------- legend ----------
const chips=document.getElementById('chips');
chips.innerHTML=DOMAINS.map(d=>`<button type="button" class="chip dom-${d.k}" data-k="${d.k}" aria-pressed="false"><i></i>${d.name}<b>${d.count}</b></button>`).join('');
chips.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)focusDomain(b.dataset.k)});
function syncChips(){chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.k===S.focusDom)))}
(function keys(){
  const R=s=>3+2*Math.sqrt(s);
  const sizes=[[10,'1万'],[50,'5万'],[150,'15万']];let x=0;
  const circ=sizes.map(([s,l])=>{const r=R(s);x+=r;const cx=x;x+=r+14;return`<circle cx="${cx}" cy="${-r}" r="${r}" fill="none" stroke="var(--ink2)"/><text x="${cx}" y="12" text-anchor="middle">${l}</text>`}).join('');
  const lines=[1,2,3].map((w,i)=>`<line x1="0" x2="34" y1="${-24+i*10}" y2="${-24+i*10}" stroke="var(--link)" stroke-width="${[0,.8,1.4,2.2][w]}"/><text x="40" y="${-21+i*10}">${['弱','中','强'][i]}</text>`).join('');
  document.getElementById('keys').innerHTML=`<div><svg width="${x}" height="62" viewBox="0 -48 ${x} 62">${circ}</svg><svg width="80" height="14"><text class="k-label" x="0" y="11">年论文量</text></svg></div><div><svg width="70" height="62" viewBox="0 -48 70 62">${lines}</svg><svg width="70" height="14"><text class="k-label" x="0" y="11">联系强度</text></svg></div>`;
})();

// ---------- search ----------
const q=document.getElementById('q'),res=document.getElementById('results');
const INDEX=[];
NODES.forEach(n=>{INDEX.push({t:n.name,alt:(n.en+' '+n.full).toLowerCase(),id:n.id,kind:'学科'});n.branches.forEach(b=>INDEX.push({t:b.n,alt:b.g,id:n.id,branch:b.n,kind:'分支'}))});
let hits=[],cur=0;
function runSearch(){
  const v=q.value.trim().toLowerCase();
  if(!v){res.hidden=true;return}
  hits=INDEX.filter(e=>e.t.toLowerCase().includes(v)||e.alt.toLowerCase().includes(v))
    .sort((a,b)=>(a.kind===b.kind?0:a.kind==='学科'?-1:1)||(a.t.startsWith(v)?-1:0)-(b.t.startsWith(v)?-1:0)).slice(0,14);
  cur=0;
  res.innerHTML=hits.length?hits.map((h,i)=>{const n=BY[h.id];return`<li><button type="button" class="dom-${n.dom}${i===0?' on':''}" data-i="${i}"><span class="dot"></span>${esc(h.t)}<small>${h.branch?'分支 · '+esc(n.name):DOM[n.dom].name}</small></button></li>`}).join(''):'<li class="empty">没有找到，试试更短的关键词</li>';
  res.hidden=false;
}
function pick(i){const h=hits[i];if(!h)return;res.hidden=true;q.blur();select(h.id,{branch:h.branch})}
q.addEventListener('input',runSearch);
q.addEventListener('focus',runSearch);
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){pick(cur);e.preventDefault()}
  else if(e.key==='Escape'){res.hidden=true;q.blur()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){cur=(cur+(e.key==='ArrowDown'?1:-1)+hits.length)%Math.max(1,hits.length);res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));e.preventDefault()}
});

VIEWS.pack=(()=>{

  function build(){

      .on('mousemove',(e,d)=>{if(d.data.t!=='dom')showTip(e,BY[d.data.id],d.data.t==='br'?'分支：'+d.data.name:'')})

      .style('opacity',l=>hiL&&hiL(l)?(f?.9:.55):[0,.14,.24,.4][l.w]);
    linkSel.filter(l=>hiL&&hiL(l)).raise();
  }
  function center(id,instant){
    apply();
    if(!zoom)return;
    // rotate nothing; just make sure the whole ring is visible
    if(kNow<fitT().k*.98)svg.transition().duration(instant?0:DUR).call(zoom.transform,fitT());
  }
  function focusDom(){apply()}
  return{render,apply,center,focusDom,
    zoomBy:f=>svg.transition().duration(DUR/2).call(zoom.scaleBy,f),
    reset:()=>svg.transition().duration(DUR).call(zoom.transform,fitT())};
})();
